[pytest]
# Activate pytest-django against the project settings so a plain ``pytest``
# run executes BOTH the pure-function tests and the Django/DRF TestCase
# classes (previously the TestCase-based tests errored with
# ImproperlyConfigured and only ran under ``manage.py test``).
DJANGO_SETTINGS_MODULE = config.settings
# Also collect Django-style tests.py files (apps/core/tests.py holds the
# Phase 8 ServeMedia/Healthz suites) — the default test_*.py pattern misses
# them and they'd only run under `manage.py test`.
python_files = test_*.py tests.py
# The clean-up of 2026-10-04 (his "tests never leave test media folders in the temp folder"): pytest keeps every
# test's tmp_path folder for three runs by default; they are removed when each test ends.
tmp_path_retention_policy = none
markers =
    allow_outbound_network: §AY1 — lift the conftest outbound-call guard for ONE test. Every use must be justified in the tranche report; `grep -rn allow_outbound_network` lists them all.
