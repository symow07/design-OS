# Production stack (Milestone 14.3): web (gunicorn) + Celery worker + Redis +
# Postgres. Configure via a .env file next to this compose file (SECRET_KEY,
# ALLOWED_HOSTS, API keys, POSTGRES_PASSWORD, ...). TLS termination is
# expected in front of `web` (nginx/traefik/cloud LB) — SECURE_PROXY_SSL_HEADER
# is already configured in settings.
#
# Deploy:   docker compose -f docker-compose.prod.yml up -d --build
# Logs:     docker compose -f docker-compose.prod.yml logs -f web worker
# Backup:   see scripts/backup.sh + RUNBOOK.md

services:
  web:
    build: .
    restart: unless-stopped
    # SIZING (hardening 2026-07-04): each live SSE task stream holds one
    # gthread thread (up to ~5 min). Concurrent capacity = workers x threads;
    # the default image CMD is 2x8 = 16. For a team of ~10 with batch runs,
    # override upward, e.g.:
    # command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
    #           "--workers", "4", "--worker-class", "gthread", "--threads", "16",
    #           "--timeout", "120", "--access-logfile", "-"]
    env_file: .env
    environment:
      DEBUG: "false"
      CELERY_EAGER: "false"
      DATABASE_URL: postgresql://bbrose:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bbrose
      REDIS_URL: redis://redis:6379/0
      USE_MANIFEST_STATIC: "true"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz (Milestone 8.7): 200 when DB+Redis+worker are all green.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/healthz', timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DEBUG: "false"
      CELERY_EAGER: "false"
      DATABASE_URL: postgresql://bbrose:${POSTGRES_PASSWORD}@postgres:5432/bbrose
      REDIS_URL: redis://redis:6379/0
      SKIP_DJANGO_SETUP: "1"   # web runs migrate/collectstatic; don't race it
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbrose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bbrose
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbrose"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
